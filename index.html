<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#06162f" />
<title>AIのその先｜VIDEO → EXPERIENCE</title>
<meta name="description" content="動画の続きを、触って理解する。動画で見たキーワードから対応するAI体験をひらきます。" />
<style>
:root{
  --bg:#06162f;
  --bg-deep:#031026;
  --panel:#081b39;
  --line:rgba(108,216,238,.24);
  --cyan:#6fe7f4;
  --cyan-soft:#b7f3f7;
  --ivory:#fffaf0;
  --text:#f8fbff;
  --sub:#c9d9e7;
  --muted:#8fa8bd;
  --danger:#f1b7b7;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg-deep);color:var(--text)}
body{
  min-height:100svh;
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic","Noto Sans JP",sans-serif;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
button,input{font:inherit}
button{touch-action:manipulation}
.app{
  min-height:100svh;
  display:grid;
  place-items:center;
  position:relative;
  overflow:hidden;
  padding:max(18px,env(safe-area-inset-top)) 20px max(18px,env(safe-area-inset-bottom));
  background:
    radial-gradient(circle at 50% 110%,rgba(70,183,208,.14),transparent 34%),
    radial-gradient(circle at 12% 5%,rgba(56,111,192,.10),transparent 28%),
    linear-gradient(180deg,#06162f 0%,#071d3c 58%,#04142d 100%);
}
.app:before{
  content:"";
  position:absolute;inset:0;pointer-events:none;opacity:.10;
  background-image:radial-gradient(circle,rgba(164,234,244,.9) 0 1px,transparent 1.3px);
  background-size:96px 96px;
  mask-image:linear-gradient(to bottom,#000 0%,transparent 72%);
}
.wrap{
  width:min(100%,560px);
  position:relative;
  z-index:2;
}
.brand{
  text-align:center;
  margin-bottom:14px;
  font-size:11px;
  line-height:1;
  font-weight:900;
  letter-spacing:.18em;
  color:#d9eaf6;
}
.panel{
  border:1px solid var(--line);
  border-radius:24px;
  background:rgba(5,19,43,.86);
  box-shadow:0 20px 54px rgba(0,0,0,.28);
  padding:28px 24px 24px;
  backdrop-filter:blur(12px);
}
.kicker{
  width:max-content;
  max-width:100%;
  margin:0 auto 16px;
  padding:6px 10px;
  border:1px solid rgba(111,231,244,.25);
  border-radius:999px;
  color:#c9f3f7;
  background:rgba(63,171,197,.07);
  font-size:10px;
  line-height:1;
  font-weight:900;
  letter-spacing:.16em;
}
h1{
  margin:0;
  text-align:center;
  font-size:clamp(32px,8.5vw,46px);
  line-height:1.23;
  letter-spacing:-.035em;
  font-weight:950;
  text-wrap:balance;
}
h1 .value{
  display:inline-block;
  color:var(--ivory);
  text-shadow:0 0 14px rgba(111,231,244,.13);
  position:relative;
}
h1 .value:after{
  content:"";
  position:absolute;
  left:4%;right:4%;bottom:-5px;
  height:2px;
  border-radius:999px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  opacity:.58;
}
.lead{
  margin:22px auto 20px;
  max-width:30em;
  text-align:center;
  color:var(--sub);
  font-size:15.5px;
  line-height:1.72;
  font-weight:750;
}
.form{
  width:min(100%,420px);
  margin:0 auto;
  display:grid;
  gap:11px;
}
.field-wrap{position:relative}
.input{
  width:100%;
  height:58px;
  border-radius:15px;
  border:1px solid rgba(111,231,244,.30);
  outline:none;
  background:#081d3f;
  color:#fff;
  padding:0 46px 0 16px;
  font-size:16px;
  font-weight:800;
  letter-spacing:.01em;
  transition:border-color .16s ease,box-shadow .16s ease,background .16s ease;
}
.input::placeholder{color:#7895ad;font-weight:700}
.input:focus{
  border-color:rgba(111,231,244,.68);
  background:#092247;
  box-shadow:0 0 0 3px rgba(111,231,244,.07);
}
.match{
  position:absolute;
  right:15px;top:50%;
  transform:translateY(-50%);
  width:25px;height:25px;
  display:grid;place-items:center;
  border-radius:50%;
  color:#062339;
  background:var(--cyan);
  font-size:14px;
  font-weight:950;
  opacity:0;
  scale:.85;
  transition:opacity .16s ease,scale .16s ease;
  pointer-events:none;
}
.field-wrap.matched .match{opacity:1;scale:1}
.go{
  min-height:58px;
  border:1px solid rgba(111,231,244,.68);
  border-radius:15px;
  background:linear-gradient(180deg,#0d6fa5,#0a5684);
  color:#fff;
  font-size:16px;
  font-weight:950;
  letter-spacing:.01em;
  cursor:pointer;
  box-shadow:0 10px 24px rgba(0,0,0,.20);
  transition:transform .10s ease,filter .10s ease,border-color .12s ease;
}
.go:active{transform:translateY(1px) scale(.992);filter:brightness(1.05)}
.go.ready{
  border-color:#8cf0f8;
  background:linear-gradient(180deg,#0d789f,#09628c);
}
.note{
  margin:11px 0 0;
  text-align:center;
  color:var(--muted);
  font-size:11px;
  line-height:1.55;
  font-weight:700;
}
.message{
  min-height:22px;
  margin:10px auto 0;
  max-width:31em;
  text-align:center;
  color:var(--danger);
  font-size:12.5px;
  line-height:1.55;
  font-weight:750;
}
.transition{
  position:fixed;
  inset:0;
  z-index:1000;
  display:grid;
  place-items:center;
  padding:24px;
  background:#04142d;
  opacity:0;
  visibility:hidden;
  transition:opacity .17s ease,visibility .17s ease;
}
.transition.show{opacity:1;visibility:visible}
.transition-inner{text-align:center}
.transition-topic{
  margin:0;
  color:var(--ivory);
  font-size:clamp(35px,10vw,58px);
  line-height:1;
  font-weight:950;
  letter-spacing:-.045em;
}
.transition-sub{
  margin-top:11px;
  color:var(--cyan);
  font-size:11px;
  line-height:1;
  font-weight:950;
  letter-spacing:.22em;
}
@media(max-width:430px){
  .app{place-items:start center;padding:18px 20px 16px}
  .wrap{margin-top:clamp(8px,2.3svh,20px)}
  .brand{margin-bottom:12px}
  .panel{padding:24px 20px 20px;border-radius:22px}
  .kicker{margin-bottom:14px}
  h1{font-size:clamp(32px,9vw,38px)}
  .lead{margin:19px auto 18px;font-size:15px}
  .input,.go{height:58px;min-height:58px}
  .note{margin-top:10px}
}
@media(max-height:700px){
  .app{padding-top:10px;padding-bottom:10px}
  .wrap{margin-top:0}
  .brand{margin-bottom:9px}
  .panel{padding-top:20px;padding-bottom:18px}
  .kicker{margin-bottom:11px}
  h1{font-size:30px}
  .lead{margin:14px auto 14px;font-size:14px;line-height:1.55}
  .input,.go{height:54px;min-height:54px}
  .note{font-size:10.5px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<main class="app">
  <div class="wrap">
    <div class="brand">AIのその先</div>

    <section class="panel" aria-labelledby="hero-title">
      <div class="kicker">VIDEO → EXPERIENCE</div>

      <h1 id="hero-title">
        動画の続きを、<br>
        <span class="value">触って理解する。</span>
      </h1>

      <p class="lead">
        動画で見たキーワードを入力してください。<br>
        対応する体験がすぐに開きます。
      </p>

      <form class="form" id="keywordForm" novalidate>
        <div class="field-wrap" id="fieldWrap">
          <input
            id="keyword"
            class="input"
            type="text"
            inputmode="text"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="キーワードを入力　例：LLM"
            aria-label="動画で見たキーワード"
            aria-describedby="message"
          />
          <span class="match" aria-hidden="true">✓</span>
        </div>

        <button id="openButton" class="go" type="submit">
          体験をひらく →
        </button>
      </form>

      <div id="message" class="message" aria-live="polite"></div>

      <p class="note">
        キーワードは動画の最後に表示しています
      </p>
    </section>
  </div>
</main>

<div id="transition" class="transition" aria-hidden="true">
  <div class="transition-inner">
    <p id="transitionTopic" class="transition-topic"></p>
    <div class="transition-sub">EXPERIENCE</div>
  </div>
</div>

  <script src="topics.js"></script>
<script>
/*
  公開済みコンテンツだけをここに追加します。
  例:
  "rag": { label: "RAG", url: "rag.html" }
  "aiエージェント": { label: "AIエージェント", url: "ai-agent.html" }
*/
const topics = window.AI_NO_SONOSAKI_TOPICS || {};

const form = document.getElementById("keywordForm");
const input = document.getElementById("keyword");
const button = document.getElementById("openButton");
const message = document.getElementById("message");
const fieldWrap = document.getElementById("fieldWrap");
const transition = document.getElementById("transition");
const transitionTopic = document.getElementById("transitionTopic");

function normalize(value){
  return value
    .normalize("NFKC")
    .trim()
    .toLowerCase()
    .replace(/[　\s]+/g,"");
}

function resolveTopic(value){
  return topics[normalize(value)] || null;
}

/*
  計測用イベント。
  GTM/GA4などを後から接続できるよう dataLayer に積み、
  同時に CustomEvent も発火します。
*/
window.dataLayer = window.dataLayer || [];
function trackEvent(name, detail = {}){
  const payload = { event:name, ...detail };
  window.dataLayer.push(payload);
  window.dispatchEvent(new CustomEvent("ai-no-sonosaki:" + name,{detail}));
}

function renderState(){
  const topic = resolveTopic(input.value);
  message.textContent = "";

  if(topic){
    fieldWrap.classList.add("matched");
    button.classList.add("ready");
    button.textContent = `${topic.label}を体験する →`;
  }else{
    fieldWrap.classList.remove("matched");
    button.classList.remove("ready");
    button.textContent = "体験をひらく →";
  }
}

function openExperience(topic){
  trackEvent("keyword_match",{topic:topic.label});
  trackEvent("experience_open",{topic:topic.label,target:topic.url});

  transitionTopic.textContent = topic.label;
  transition.classList.add("show");
  transition.setAttribute("aria-hidden","false");

  setTimeout(()=>{
    window.location.href = topic.url;
  }, 420);
}

document.addEventListener("DOMContentLoaded",()=>{
  trackEvent("landing_view");
});

input.addEventListener("focus",()=>{
  trackEvent("input_focus");
});

input.addEventListener("input",renderState);

form.addEventListener("submit",(e)=>{
  e.preventDefault();

  const raw = input.value;
  const normalized = normalize(raw);
  trackEvent("keyword_submit",{keyword:normalized});

  const topic = resolveTopic(raw);

  if(topic){
    openExperience(topic);
    return;
  }

  message.textContent =
    "キーワードが見つかりませんでした。動画の最後に表示されたキーワードを、もう一度確認してみてください。";
  fieldWrap.classList.remove("matched");
  button.classList.remove("ready");
  button.textContent = "体験をひらく →";
});

/*
  将来、ストーリーズや外部導線から
  ?topic=llm のような直リンクも利用できます。
  自動フォーカスは行いません。
*/
const params = new URLSearchParams(location.search);
const topicParam = params.get("topic");
if(topicParam){
  input.value = topicParam;
  renderState();
}
</script>
</body>
</html>
